# Внешняя конфигурация PostgreSQL. Подключается из application-xxlgate.yml
# при активном профиле pg. Не хранить учётные данные в Git.
spring:
  datasource:
    url: ${PG_DB_URL}
    username: ${PG_DB_USER}
    password: ${PG_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    addresses: ${PG_RABBITMQ_ADDRESSES}
    username: ${PG_RABBITMQ_USERNAME}
    password: ${PG_RABBITMQ_PASSWORD}
