name: ${COMPOSE_PROJECT_NAME:-edo}

services:

  xxl:
    build:
      context: .
      dockerfile: Dockerfile
    image: xxl-gate:${XXL_IMAGE_TAG:-1.0.0}
    environment:
      SPRING_PROFILES_ACTIVE: xxlgate,docker
      MI_TRANSPORT_HOST: mi
      MI_TRANSPORT_PASSWORD: ${MI_TRANSPORT_PASSWORD}
      DB_URL: ${XXL_DB_URL}
      DB_USER: ${XXL_DB_USER}
      DB_PASSWORD: ${XXL_DB_PASSWORD}
      TZ: Europe/Moscow
      LOGGING_LEVEL_ROOT: DEBUG
      LOGGING_LEVEL_RU_INVERSION: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_AMQP: DEBUG
    ports:
      - "${XXL_PORT:-8081}:8080"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
