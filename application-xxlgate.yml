spring:
  datasource:
    url: ${DB_URL} #?escapeSyntaxCallMode=callIfNoReturn
    username: ${DB_USER}
    password: ${DB_PASSWORD}

    hikari:
      maximum-pool-size: 12

  output:
    ansi:
      enabled: always

  rabbitmq:
    addresses: ${XXL_CBSBUS_ADDRESSES}
    username: ${XXL_CBSBUS_USER}
    password: ${XXL_CBSBUS_PASSWORD}
    listener:
      simple:
        concurrency: 2
        max-concurrency: 2

service:
  name: xxl-gate

logging:
  file:
    name: "log/${service.name}.log"

  charset:
    console: UTF-8
    file: UTF-8

  level:
    root: INFO

    org.springframework: WARN
    org.springframework.amqp: WARN
    com.rabbitmq.client: WARN
    com.rabbitmq: WARN
    com.zaxxer.hikari: WARN
    com.zaxxer.hikari.HikariConfig: INFO

    ru.inversion: INFO
    ru.inversion.sql: DEBUG

  logback:
    rollingpolicy:
      max-history: 14

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level%X{xxl.console.prefix} [%thread] %logger{40} : %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level%X{xxl.file.prefix} [%thread] %logger{40} : %msg%n"


xxl:
  mi-0001:
    auto-prepare:
      # Каждый день в 02:30
      cron: "0 30 2 * * * ? 2099"
    scheduler:
      enabled: false      

  mi-0600:
    scheduler:
      enabled: false
    processed-cleaner:
      cron: "0 0 3 * * * ? 2099"