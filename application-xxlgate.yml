spring:
  datasource:
    hikari:
      maximum-pool-size: 12

  output:
    ansi:
      enabled: always

  rabbitmq:
    listener:
      simple:
        concurrency: 2
        max-concurrency: 2

service:
  name: xxl-gate

logging:
  file:
    name: "log/${service.name}.log"

  charset:
    console: UTF-8
    file: UTF-8

  level:
    root: INFO

    org.springframework: WARN
    org.springframework.amqp: WARN
    com.rabbitmq.client: WARN
    com.rabbitmq: WARN
    com.zaxxer.hikari: WARN
    com.zaxxer.hikari.HikariConfig: INFO

    ru.inversion: INFO
    ru.inversion.sql: DEBUG

  logback:
    rollingpolicy:
      max-history: 14

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level%X{xxl.console.prefix} [%thread] %logger{40} : %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level%X{xxl.file.prefix} [%thread] %logger{40} : %msg%n"

xxl:
  mi-0001:
    auto-prepare:
      # Каждый день в 02:30
      cron: "0 30 2 * * *"

  mi-0600:
    processed-cleaner:
      cron: "0 0 3 * * *"

# Внешние настройки контуров: импортируются только при соответствующем профиле.
# Для работы с БД обязателен pg или oracle: без контура подключения не заданы.
---
spring:
  config:
    activate:
      on-profile: oracle
    import: "file:./application-xxlgate-oracle.yml"

---
spring:
  config:
    activate:
      on-profile: pg
    import: "file:./application-xxlgate-pg.yml"
