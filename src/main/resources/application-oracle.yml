# Oracle overlay. Activate AFTER xxlgate: --spring.profiles.active=xxlgate,oracle
# No default RabbitMQ vhost: avoid accidentally connecting to the PG bus.
spring:
  datasource:
    url: ${ORACLE_DB_URL}
    username: ${ORACLE_DB_USER}
    password: ${ORACLE_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  rabbitmq:
    addresses: ${ORACLE_RABBITMQ_ADDRESSES}
    username: ${ORACLE_RABBITMQ_USERNAME}
    password: ${ORACLE_RABBITMQ_PASSWORD}
